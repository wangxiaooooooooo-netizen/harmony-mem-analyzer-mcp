[project]
name = "mem-analyzer-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.3",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.5",
    "typer>=0.9",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "mypy>=1.5",
]

[dependency-groups]
dev = [
    "nuitka",
    "pyinstaller>=6.22.3",
]
