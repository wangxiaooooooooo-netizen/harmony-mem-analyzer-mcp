name: Build macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 0.1.1)'
        required: false
        type: string

jobs:
  build-macos:
    name: Build macOS x64
    runs-on: macos-latest
    timeout-minutes: 30
    
    env:
      PYTHON_VERSION: '3.12'
      PROJECT_DIR: '.'
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install uv
        run: |
          pip install uv
          uv --version
      
      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ${{ env.PROJECT_DIR }}/.venv
          key: ${{ runner.os }}-uv-${{ hashFiles('./uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      
      - name: Sync dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          uv sync --extra build
          uv pip list
      
      - name: Get version
        id: version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            # github.ref_name is like "v0.1.1", remove leading 'v'
            version="${{ github.ref_name }}"
            version="${version#v}"
          fi
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "当前版本: $version"
      
      - name: Build macOS x64 (PyInstaller)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python build.py --tool pyinstaller --platform macos --arch x64 --verify --package
      
      - name: Verify binary
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          binary="dist/mem-analyzer-mcp"
          if [[ -f "$binary" ]]; then
            size=$(du -h "$binary" | cut -f1)
            echo "二进制大小: $size"
            "$binary" --help 2>&1 | head -5
            echo "✅ 启动测试通过"
          else
            echo "❌ 未找到二进制文件"
            exit 1
          fi
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mem-analyzer-mcp-macos-${{ steps.version.outputs.version }}
          path: |
            ${{ env.PROJECT_DIR }}/dist/*.tar.gz
            ${{ env.PROJECT_DIR }}/dist/mem-analyzer-mcp
          retention-days: 30
      
      - name: Add to Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ env.PROJECT_DIR }}/dist/*.tar.gz
            ${{ env.PROJECT_DIR }}/dist/mem-analyzer-mcp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}